<!-- Image Modal -->
<div id="imageModal" class="fixed inset-0 bg-black bg-opacity-80 hidden z-50 flex items-center justify-center p-4" onclick="closeModal()">
  <img id="modalImage" src="" alt="Full View" class="max-h-[90vh] max-w-full rounded-lg shadow-xl border-4 border-white transition-transform duration-300 scale-95">
  <span class="absolute top-6 right-6 text-white text-4xl cursor-pointer hover:scale-125 transition-transform" onclick="closeModal()">&times;</span>
</div>

<!-- Modal Script -->
<script>
  function openModal(src) {
    document.getElementById('modalImage').src = src;
    document.getElementById('imageModal').classList.remove('hidden');
  }
  function closeModal() {
    document.getElementById('imageModal').classList.add('hidden');
  }
</script>

<!-- JS -->
<script>
  // Hamburger Toggle
  document.getElementById('menu-toggle').addEventListener('click', function () {
    const menu = document.getElementById('mobile-menu');
    menu.classList.toggle('hidden');
  });

  // Dynamic Year
  document.getElementById('year').textContent = new Date().getFullYear();

  // Slideshow Logic
  const slides = document.querySelectorAll('.slide');
  let current = 0;

  function showSlide(index) {
    slides.forEach((slide, i) => {
      slide.style.opacity = i === index ? '1' : '0';
    });
  }

  function nextSlide() {
    current = (current + 1) % slides.length;
    showSlide(current);
  }

  setInterval(nextSlide, 5000); // 5 seconds
  showSlide(current);
</script>
